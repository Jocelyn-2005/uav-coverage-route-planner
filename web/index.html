<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双机低算力覆盖规划器</title><link rel="stylesheet" href="/styles.css?v=18"></head>
<body><header><strong>双机低算力覆盖规划器</strong><span id="coords">ENU 东向 0.0，北向 0.0</span><button id="plan">生成两架无人机航线</button></header>
<main><aside>
<section><h2>责任区与起点</h2><p class="hint">两个责任区不能重叠。点击按钮后在地图上选择矩形两个对角。</p><button class="draw-region drone-1" data-drone="0">绘制无人机 1 责任区</button><label>无人机 1 起点 x / y（米）<div><input id="home1-x" type="number" value="153.4"><input id="home1-y" type="number" value="67.2"></div></label><button class="draw-region drone-2" data-drone="1">绘制无人机 2 责任区</button><label>无人机 2 起点 x / y（米）<div><input id="home2-x" type="number" value="153.4"><input id="home2-y" type="number" value="67.2"></div></label></section>
<section><h2>覆盖规划</h2><label>飞行高度（米）<input id="alt" type="number" value="30"></label><label>扫描方向<select id="direction"><option value="auto">Auto（0° / 90°）</option><option value="0">0°</option><option value="90">90°</option></select></label><p class="hint">Global Scanline + Greedy，两架无人机独立规划。</p><label>水平 / 垂直安全距离（米）<div><input id="hc" type="number" value="3"><input id="vc" type="number" value="2"></div></label></section>
<section><h2>相机与飞行</h2><label>水平 / 垂直视场角（度）<div><input id="hfov" type="number" value="60"><input id="vfov" type="number" value="45"></div></label><label>航向 / 旁向重叠率<div><input id="fo" type="number" step=".05" value=".3"><input id="so" type="number" step=".05" value=".3"></div></label><label>航点最大间距（米）<input id="control-spacing" type="number" value="10"></label><label>覆盖 / 连接速度（米/秒）<div><input id="lane-speed" type="number" value="5"><input id="connector-speed" type="number" value="4"></div></label><label>避障速度（米/秒）<input id="obstacle-speed" type="number" value="2.5"></label></section>
<section><h2>图层与动画</h2><label><input type="checkbox" data-layer="background" checked> 航拍底图</label><label><input type="checkbox" data-layer="buildings" checked> 建筑</label><label><input type="checkbox" data-layer="coverage" checked> 覆盖显示</label><label><input type="checkbox" data-layer="lanes" checked> 覆盖航线</label><label><input type="checkbox" data-layer="transitions" checked> 连接 / 避障 / 返航</label><label><input type="checkbox" data-layer="waypoints"> 飞控航点</label><button id="replay" disabled>播放飞行动画</button><label>动画速度<input id="speed" type="range" min="1" max="10" value="5"></label></section>
<section id="summary"><h2>规划结果</h2><p>等待规划</p></section><section><h2>导出</h2><div id="exports"></div></section>
</aside><div id="map"><svg id="canvas"></svg><div id="draw-tip"></div><div id="error"></div></div></main><script src="/app.js?v=32"></script></body></html>
