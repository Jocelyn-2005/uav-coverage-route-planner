<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云谷无人机覆盖搜索规划器</title><link rel="stylesheet" href="/styles.css?v=7"></head>
<body><header><strong>云谷无人机覆盖搜索规划器</strong><span id="coords">ENU 东向 0.0，北向 0.0</span><button id="plan">开始规划</button></header>
<main><aside><section><h2>任务设置</h2><label>飞行高度（米）<input id="alt" type="number" value="25"></label><label>起降点 ENU 东向 / 北向（米）<div><input id="home-x" type="number" step=".1" value="153.4"><input id="home-y" type="number" step=".1" value="67.2"></div></label><label>规划策略<select id="pattern"><option value="auto">自动比较</option><option value="contour_outward">由内向外轮廓搜索</option><option value="lawn_mower">往复式覆盖搜索</option></select></label><label>扫描方向（度）<input id="angle" type="number" value="90"></label><label>水平安全距离（米）<input id="hc" type="number" value="3"></label><label>垂直安全距离（米）<input id="vc" type="number" value="2"></label></section>
<section><h2>相机设置</h2><label>水平 / 垂直视场角（度）<div><input id="hfov" type="number" value="60"><input id="vfov" type="number" value="45"></div></label><label>航向 / 旁向重叠率<div><input id="fo" type="number" step=".05" value=".3"><input id="so" type="number" step=".05" value=".3"></div></label></section>
<section><h2>飞行设置</h2><label>拍摄频率（赫兹）<input id="frequency" type="number" step=".5" value="2"></label><label>途径点最大间距（米）<input id="control-spacing" type="number" min="1" step="1" value="10"></label><label>覆盖航线 / 连接航线速度（米/秒）<div><input id="lane-speed" type="number" step=".5" value="5"><input id="connector-speed" type="number" step=".5" value="4"></div></label><label>避障速度（米/秒）<input id="obstacle-speed" type="number" step=".5" value="2.5"></label></section>
<section><h2>地图图层</h2><label><input type="checkbox" data-layer="background" checked> 航拍底图</label><label><input type="checkbox" data-layer="buildings"> 语义建筑</label><label><input type="checkbox" data-layer="patches" checked> 搜索网格</label><label><input type="checkbox" data-layer="route" checked> 飞行路线</label><label><input type="checkbox" data-layer="waypoints" checked> 飞行控制点</label></section><section><h2>任务回放</h2><button id="replay" disabled>回放任务</button><label>回放速度<input id="speed" type="range" min="1" max="10" value="5"></label></section><section id="summary"><h2>规划结果</h2><p>等待规划</p></section><section><h2>导出文件</h2><div id="exports"></div></section></aside>
<div id="map"><svg id="canvas" viewBox="-10 -220 345 235"></svg><div id="error"></div></div></main><script src="/app.js?v=8"></script></body></html>
