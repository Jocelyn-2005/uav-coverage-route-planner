<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coverage Planner</title><link rel="stylesheet" href="/styles.css?v=4"></head>
<body><header><strong>Yungu Coverage Planner</strong><span id="coords">ENU x 0.0, y 0.0</span><button id="plan">Plan</button></header>
<main><aside><section><h2>Mission</h2><label>Flight altitude (m)<input id="alt" type="number" value="25"></label><label>Home ENU<div><input type="number" value="153.4" disabled><input type="number" value="67.2" disabled></div></label><label>Strategy<select id="pattern"><option value="auto">Auto compare</option><option value="contour_outward">Contour outward</option><option value="lawn_mower">Lawn mower</option></select></label><label>Scan direction<input id="angle" type="number" value="90"></label><label>Horizontal clearance (m)<input id="hc" type="number" value="3"></label><label>Vertical clearance (m)<input id="vc" type="number" value="2"></label></section>
<section><h2>Camera</h2><label>Horizontal / vertical FOV<div><input id="hfov" type="number" value="60"><input id="vfov" type="number" value="45"></div></label><label>Forward / side overlap<div><input id="fo" type="number" step=".05" value=".3"><input id="so" type="number" step=".05" value=".3"></div></label></section>
<section><h2>Layers</h2><label><input type="checkbox" data-layer="background" checked> Overhead map</label><label><input type="checkbox" data-layer="buildings"> Semantic buildings</label><label><input type="checkbox" data-layer="patches" checked> Patches</label><label><input type="checkbox" data-layer="route" checked> Route</label><label><input type="checkbox" data-layer="waypoints" checked> Waypoints</label></section><section><h2>Animation</h2><button id="replay" disabled>Replay mission</button><label>Speed<input id="speed" type="range" min="1" max="10" value="5"></label></section><section id="summary"><h2>Result</h2><p>Ready</p></section><section><h2>Export</h2><div id="exports"></div></section></aside>
<div id="map"><svg id="canvas" viewBox="-10 -220 345 235"></svg><div id="error"></div></div></main><script src="/app.js?v=5"></script></body></html>
